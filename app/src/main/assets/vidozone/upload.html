<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d12">
  <title>Publier une vidéo - VidoZone</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <!-- ==========================================================================
       HEADER PUBLICATION
       ========================================================================== -->
  <header class="vz-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="vz-icon-btn" onclick="window.history.back()" aria-label="Retour">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h2 style="font-size:17px;font-weight:800;">Nouvelle vidéo</h2>
    </div>
  </header>

  <!-- ==========================================================================
       FORMULAIRE DE PUBLICATION
       ========================================================================== -->
  <main class="vz-upload-container">

    <!-- Zone Glisser-Déposer / Sélection Vidéo -->
    <div class="vz-upload-dropzone" id="vzVideoDropzone">
      <div class="vz-upload-dropzone-icon">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      </div>
      <div class="vz-upload-dropzone-title">Touchez pour choisir une vidéo</div>
      <div class="vz-upload-dropzone-sub">MP4, WebM ou MOV (max 150 Mo)</div>
      <input type="file" id="vzVideoFileInput" accept="video/*" style="display:none;">
    </div>

    <!-- Prévisualisation de la vidéo sélectionnée -->
    <div class="vz-preview-video-container" id="vzPreviewVideoWrap">
      <video id="vzPreviewVideo" controls playsinline></video>
    </div>

    <!-- Titre -->
    <div class="vz-form-group">
      <label class="vz-label" for="vzUploadTitle">Titre de la vidéo *</label>
      <input class="vz-input" type="text" id="vzUploadTitle" placeholder="Ex: Mon voyage musical à Abidjan 2026" required>
    </div>

    <!-- Description -->
    <div class="vz-form-group">
      <label class="vz-label" for="vzUploadDesc">Description</label>
      <textarea class="vz-textarea" id="vzUploadDesc" placeholder="Décrivez votre vidéo, vos crédits et liens..."></textarea>
    </div>

    <!-- Sélection de la miniature -->
    <div class="vz-form-group">
      <label class="vz-label">Miniature personnalisée</label>
      <label for="vzThumbFileInput" class="vz-thumb-picker-btn">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>Choisir une image de couverture</span>
      </label>
      <input type="file" id="vzThumbFileInput" accept="image/*" style="display:none;">
      <img id="vzThumbPreviewImg" class="vz-thumb-preview" alt="Aperçu miniature">
    </div>

    <!-- Catégorie -->
    <div class="vz-form-group">
      <label class="vz-label" for="vzUploadCategory">Catégorie</label>
      <select class="vz-select" id="vzUploadCategory">
        <option value="Musique">Musique</option>
        <option value="Gaming">Gaming</option>
        <option value="Comédie">Comédie</option>
        <option value="Sport">Sport</option>
        <option value="Actualités">Actualités</option>
        <option value="Éducation">Éducation</option>
        <option value="Technologie">Technologie</option>
        <option value="Afrique">Afrique</option>
      </select>
    </div>

    <!-- Tags -->
    <div class="vz-form-group">
      <label class="vz-label" for="vzUploadTags">Tags (séparés par des virgules)</label>
      <input class="vz-input" type="text" id="vzUploadTags" placeholder="musique, afrobeats, concert, live">
    </div>

    <!-- Visibilité -->
    <div class="vz-form-group">
      <label class="vz-label">Visibilité</label>
      <div style="display:flex;gap:20px;margin-top:6px;">
        <label class="vz-radio-label">
          <input type="radio" name="vzVisibility" value="public" checked>
          <span>Public (visible par tous)</span>
        </label>
        <label class="vz-radio-label">
          <input type="radio" name="vzVisibility" value="private">
          <span>Privé</span>
        </label>
      </div>
    </div>

    <!-- Barre de progression de téléversement -->
    <div class="vz-progress-wrap" id="vzUploadProgressWrap">
      <div class="vz-progress-bar-bg">
        <div class="vz-progress-bar-fill" id="vzProgressBarFill"></div>
      </div>
      <div class="vz-progress-label" id="vzProgressText">Envoi en cours : 0%</div>
    </div>

    <!-- Bouton Publier -->
    <button type="button" class="vz-btn vz-btn-primary vz-btn-full" id="vzPublishBtn" style="margin-top:10px;">
      Publier la vidéo maintenant
    </button>
  </main>

  <!-- ==========================================================================
       BARRE DE NAVIGATION INFÉRIEURE
       ========================================================================== -->
  <nav class="vz-bottom-nav">
    <a href="home.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="shorts.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25.03.01 1.2.5 1.2.5L6 14.93c-1.83.97-2.53 3.24-1.56 5.07.97 1.83 3.24 2.53 5.07 1.56l8.5-4.5c1.29-.68 2.06-2.04 1.99-3.49-.07-1.42-.94-2.68-2.23-3.25zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
      <span>Shorts</span>
    </a>
    <a href="upload.html" class="vz-nav-item vz-nav-upload active">
      <div class="vz-upload-circle">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
      <span style="margin-top:2px;">Publier</span>
    </a>
    <a href="notifications.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <span>Notifs</span>
    </a>
    <a href="profile.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profil</span>
    </a>
  </nav>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
