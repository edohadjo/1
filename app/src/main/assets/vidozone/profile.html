<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d12">
  <title>Profil - VidoZone</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <!-- ==========================================================================
       HEADER DU PROFIL
       ========================================================================== -->
  <header class="vz-header">
    <span style="font-size:17px;font-weight:800;">Mon Profil</span>
    <div style="display:flex;gap:8px;">
      <button class="vz-icon-btn" onclick="window.location.href='settings.html'" aria-label="Paramètres">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
      <button class="vz-icon-btn" onclick="VZ_Auth.logout()" aria-label="Déconnexion" title="Se déconnecter">
        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      </button>
    </div>
  </header>

  <!-- ==========================================================================
       CARTE D'IDENTITÉ & STATS DU PROFIL
       ========================================================================== -->
  <main class="vz-profile-container">
    <div class="vz-profile-card">
      <div class="vz-profile-avatar-wrap">
        <img class="vz-profile-avatar" id="vzProfileAvatar" src="assets/logo.png" alt="Avatar">
      </div>
      <h2 class="vz-profile-name" id="vzProfileName">Chargement...</h2>
      <div class="vz-profile-handle" id="vzProfileHandle">@createur</div>
      <p class="vz-profile-bio" id="vzProfileBio">Regarde. Crée. Partage.</p>

      <div class="vz-profile-stats-row">
        <div class="vz-profile-stat-box">
          <div class="vz-profile-stat-val" id="vzProfileSubs">0</div>
          <div class="vz-profile-stat-lbl">Abonnés</div>
        </div>
        <div class="vz-profile-stat-box">
          <div class="vz-profile-stat-val" id="vzProfileFollow">0</div>
          <div class="vz-profile-stat-lbl">Abonnements</div>
        </div>
        <div class="vz-profile-stat-box">
          <div class="vz-profile-stat-val" id="vzProfileVideosCount">0</div>
          <div class="vz-profile-stat-lbl">Vidéos</div>
        </div>
        <div class="vz-profile-stat-box">
          <div class="vz-profile-stat-val" id="vzProfileLikesCount">0</div>
          <div class="vz-profile-stat-lbl">J'aime</div>
        </div>
      </div>

      <div class="vz-profile-actions">
        <button class="vz-btn vz-btn-primary vz-btn-sm" id="vzOpenEditProfileBtn" style="flex:1;">
          Modifier le profil
        </button>
        <button class="vz-btn vz-btn-secondary vz-btn-sm" onclick="navigator.clipboard.writeText(window.location.href); VidoZone.showToast('Lien du profil copié !', 'success');">
          Partager le profil
        </button>
      </div>
    </div>

    <!-- ==========================================================================
         ONGLETS (VIDÉOS, SHORTS, LIKES)
         ========================================================================== -->
    <div class="vz-profile-tabs">
      <button class="vz-profile-tab-btn active" data-tab="videos">Vidéos</button>
      <button class="vz-profile-tab-btn" data-tab="shorts">Shorts</button>
      <button class="vz-profile-tab-btn" data-tab="likes">J'aime</button>
    </div>

    <div class="vz-profile-grid" id="vzProfileGrid"></div>
  </main>

  <!-- ==========================================================================
       MODAL DE MODIFICATION DU PROFIL
       ========================================================================== -->
  <div class="vz-modal-backdrop" id="vzEditProfileModal">
    <div class="vz-modal-sheet">
      <div class="vz-modal-handle"></div>
      <div class="vz-modal-header">
        <h3 class="vz-modal-title">Modifier mon profil</h3>
        <button id="vzCancelProfileBtn" style="color:var(--vz-text-muted);font-size:20px;">&times;</button>
      </div>

      <div class="vz-form-group">
        <label class="vz-label" for="vzEditName">Nom affiché</label>
        <input class="vz-input" type="text" id="vzEditName">
      </div>

      <div class="vz-form-group">
        <label class="vz-label" for="vzEditUsername">Nom d'utilisateur</label>
        <input class="vz-input" type="text" id="vzEditUsername">
      </div>

      <div class="vz-form-group">
        <label class="vz-label" for="vzEditBio">Biographie</label>
        <textarea class="vz-textarea" id="vzEditBio" style="min-height:70px;"></textarea>
      </div>

      <button class="vz-btn vz-btn-primary vz-btn-full" id="vzSaveProfileBtn" style="margin-top:10px;">
        Enregistrer les modifications
      </button>
    </div>
  </div>

  <!-- ==========================================================================
       BARRE DE NAVIGATION INFÉRIEURE
       ========================================================================== -->
  <nav class="vz-bottom-nav">
    <a href="home.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="shorts.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25.03.01 1.2.5 1.2.5L6 14.93c-1.83.97-2.53 3.24-1.56 5.07.97 1.83 3.24 2.53 5.07 1.56l8.5-4.5c1.29-.68 2.06-2.04 1.99-3.49-.07-1.42-.94-2.68-2.23-3.25zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
      <span>Shorts</span>
    </a>
    <a href="upload.html" class="vz-nav-item vz-nav-upload">
      <div class="vz-upload-circle">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
      <span style="margin-top:2px;">Publier</span>
    </a>
    <a href="notifications.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <span>Notifs</span>
    </a>
    <a href="profile.html" class="vz-nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profil</span>
    </a>
  </nav>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
