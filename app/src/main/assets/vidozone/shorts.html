<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Shorts - VidoZone</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
  <style>
    body {
      background: #000;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       CONTAINER SHORTS PLEIN ÉCRAN VERTICAL
       ========================================================================== -->
  <main class="vz-shorts-screen" id="vzShortsContainer"></main>

  <!-- ==========================================================================
       MODAL BOTTOM SHEET POUR COMMENTAIRES DE SHORTS
       ========================================================================== -->
  <div class="vz-modal-backdrop" id="vzShortsCommentsModal" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="vz-modal-sheet">
      <div class="vz-modal-handle"></div>
      <div class="vz-modal-header">
        <h3 class="vz-modal-title">Commentaires du Short</h3>
        <button onclick="document.getElementById('vzShortsCommentsModal').classList.remove('active')" style="color:var(--vz-text-muted);font-size:22px;">&times;</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px;">
        <div style="display:flex;gap:10px;">
          <img src="assets/logo.png" style="width:32px;height:32px;border-radius:50%;" alt="User">
          <div>
            <span style="font-size:12px;font-weight:700;">@fan_de_tech</span>
            <p style="font-size:13px;color:var(--vz-text-secondary);margin-top:2px;">Ce Short est super utile, merci pour l'astuce !</p>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <img src="assets/icon.png" style="width:32px;height:32px;border-radius:50%;" alt="User">
          <div>
            <span style="font-size:12px;font-weight:700;">@dj_master</span>
            <p style="font-size:13px;color:var(--vz-text-secondary);margin-top:2px;">Le rythme est incroyable 🔥</p>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:8px;">
        <input type="text" id="vzShortCommentInput" class="vz-input" placeholder="Ajouter un commentaire..." style="height:42px;">
        <button class="vz-btn vz-btn-primary vz-btn-sm" onclick="VidoZone.showToast('Commentaire envoyé !', 'success'); document.getElementById('vzShortCommentInput').value='';">
          Envoyer
        </button>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       BARRE DE NAVIGATION INFÉRIEURE
       ========================================================================== -->
  <nav class="vz-bottom-nav">
    <a href="home.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="shorts.html" class="vz-nav-item active">
      <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25.03.01 1.2.5 1.2.5L6 14.93c-1.83.97-2.53 3.24-1.56 5.07.97 1.83 3.24 2.53 5.07 1.56l8.5-4.5c1.29-.68 2.06-2.04 1.99-3.49-.07-1.42-.94-2.68-2.23-3.25zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
      <span>Shorts</span>
    </a>
    <a href="upload.html" class="vz-nav-item vz-nav-upload">
      <div class="vz-upload-circle">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
      <span style="margin-top:2px;">Publier</span>
    </a>
    <a href="notifications.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <span>Notifs</span>
    </a>
    <a href="profile.html" class="vz-nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profil</span>
    </a>
  </nav>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shorts.js"></script>
</body>
</html>
